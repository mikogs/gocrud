name: vulncheck

# Checks the code and the dependencies for known vulnerabilities, see scripts/vulncheck.sh.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: ./scripts/vulncheck.sh
